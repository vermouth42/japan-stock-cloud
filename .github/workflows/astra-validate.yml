name: Astra isolated validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline regression checks
        run: python -m unittest discover -s astra/tests -v
      - name: Fetch completed sessions into isolated staging
        run: python -m astra.market_data --out astra-stage
      - uses: actions/upload-artifact@v4
        with:
          name: astra-market-data-validation
          path: astra-stage/
          retention-days: 3

# No schedule, commit, Sheets write, order, or deployment.
# The production workflow is intentionally unchanged until this passes.
